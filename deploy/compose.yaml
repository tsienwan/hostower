# 示例部署。
#
# 主密钥（加密凭据用）：不配置也能用，第一次启动会在 ./data/master_key 自动生成。
# 想和数据分开保管（公网部署推荐），先生成一把，再打开下面带 master_key 的三行：
#   docker run --rm ghcr.io/tsienwan/hostower:0.4.1 keygen > master_key
# 已经在用自动生成的那把时，把 ./data/master_key 移出来当作 ./master_key，不要重新生成。
#
# 塔台在容器里监听所有网卡，所以必须声明 TLS 由谁终结（见 README.zh-CN.md 的“暴露方式”，英文版是 README.md 的 “Exposure”）：
#   - 只在本机用：保持下面的 127.0.0.1 端口映射和 localhost 地址即可；
#   - 放在反向代理或隧道之后：把 HOSTOWER_PUBLIC_URL 改成 https://你的域名；
#   - 塔台自己终结 TLS：去掉 HOSTOWER_TLS，改用 HOSTOWER_TLS_CERT / HOSTOWER_TLS_KEY。
services:
  hostower:
    image: ghcr.io/tsienwan/hostower:0.4.1
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    ports: ["127.0.0.1:18443:18443"]
    volumes:
      - ./data:/data
      - ./config:/config:ro
    environment:
      HOSTOWER_TLS: proxy
      HOSTOWER_PUBLIC_URL: http://localhost:18443
      # HOSTOWER_MASTER_KEY_FILE: /run/secrets/master_key
    # secrets: [master_key]
# secrets:
#   master_key:
#     file: ./master_key
