apiVersion: hostower/v1
kind: App
name: mariadb
version: 11.8-1
title: MariaDB
category: 数据库
icon: database
summary: 兼容 MySQL 的关系型数据库。
description: 数据保存在实例目录下的 data 里。root 密码来自应用密钥，不出现在命令和审计里。
type: compose
params:
  - name: bind
    title: 监听地址
    type: enum
    options: ["127.0.0.1", "0.0.0.0"]
    default: 127.0.0.1
    hint: 数据库一般只在本机访问；对外开放前先确认防火墙规则。
  - name: port
    title: 端口
    type: port
    default: "3306"
  - name: database
    title: 默认数据库名
    type: string
    pattern: "[a-z][a-z0-9_]{0,62}"
    default: app
  - name: password
    title: root 用户的密码
    type: secret
    env: MARIADB_ROOT_PASSWORD
compose: |
  services:
    db:
      image: mariadb:11.8
      restart: unless-stopped
      environment:
        MARIADB_DATABASE: "{{ .database }}"
        MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
        MARIADB_AUTO_UPGRADE: "1"
      ports: ["{{ .bind }}:{{ .port }}:3306"]
      volumes: ["./data:/var/lib/mysql"]
upgrade:
  note: 升级到 11.8 后，第一次启动会自动升级数据（MARIADB_AUTO_UPGRADE）；升级前建议先备份实例目录下的 data。
notes: 连接地址 {{ .bind }}:{{ .port }}，用户 root，数据库 {{ .database }}。
