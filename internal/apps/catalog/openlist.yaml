apiVersion: hostower/v1
kind: App
name: openlist
version: 4.2.10-1
title: OpenList
category: 存储
icon: box
summary: 把多种网盘和对象存储挂成一个网页文件列表，支持 WebDAV。
description: AList 的社区分支。管理员账号是 admin，密码来自应用密钥，不出现在命令和审计里。配置和数据库保存在实例目录下的 data 里。
homepage: https://doc.oplist.org # hygiene:allow 项目的官方文档地址
type: compose
params:
  - name: bind
    title: 监听地址
    type: enum
    options: ["127.0.0.1", "0.0.0.0"]
    default: 0.0.0.0
    hint: 127.0.0.1 只能在主机本机访问（配合反向代理或 SSH 隧道）；0.0.0.0 对外开放。
  - name: port
    title: 端口
    type: port
    default: "5244"
  - name: password
    title: admin 的初始密码
    type: secret
    env: OPENLIST_ADMIN_PASSWORD
    hint: 只在第一次启动时生效；以后在 OpenList 的页面里改。
compose: |
  services:
    openlist:
      image: openlistteam/openlist:v4.2.10
      restart: unless-stopped
      user: "0:0"
      environment:
        UMASK: "022"
        OPENLIST_ADMIN_PASSWORD: ${OPENLIST_ADMIN_PASSWORD}
      ports: ["{{ .bind }}:{{ .port }}:5244"]
      volumes: ["./data:/opt/openlist/data"]
guide:
  open:
    - title: 文件列表和管理后台
      panel: true
      port: "{{ .port }}"
      bind: "{{ .bind }}"
  account: 用户名 admin，密码是安装时选的应用密钥。
  steps:
    - 登录后点页面底部的“管理”，在“存储”里添加网盘或对象存储。
    - WebDAV 地址是入口地址后面加 /dav，账号同上。
notes: 打开 http://<主机地址>:{{ .port }}，用户名 admin，密码是安装时选的应用密钥。
