apiVersion: hostower/v1
kind: App
name: open-webui
version: 0.13.4-1
title: Open WebUI
category: AI 工具
icon: sparkles
summary: 自托管的大模型聊天界面，能接 Ollama 和任何 OpenAI 兼容接口。
description: 镜像比较大（几个 GB），第一次安装要等一会儿。对话、账号和上传的文件保存在实例目录下的 data 里。模型接口在页面的管理员设置里配置，可以填 LiteLLM、New API 或各家官方接口。
homepage: https://docs.openwebui.com # hygiene:allow 项目的官方文档地址
type: compose
params:
  - name: bind
    title: 监听地址
    type: enum
    options: ["127.0.0.1", "0.0.0.0"]
    default: 0.0.0.0
    hint: 127.0.0.1 只能在主机本机访问（配合反向代理或 SSH 隧道）；0.0.0.0 对外开放。
  - name: port
    title: 端口
    type: port
    default: "3080"
compose: |
  services:
    webui:
      image: ghcr.io/open-webui/open-webui:v0.13.4
      restart: unless-stopped
      ports: ["{{ .bind }}:{{ .port }}:8080"]
      volumes: ["./data:/app/backend/data"]
guide:
  open:
    - title: 聊天界面
      port: "{{ .port }}"
      bind: "{{ .bind }}"
  account: 没有初始账号：第一个注册的人就是管理员，装好后尽快打开注册。
  steps:
    - 第一次启动要一两分钟，页面打不开就稍等再刷新。
    - 注册后在管理员设置的“外部连接”里填 OpenAI 兼容接口的地址和 API Key（比如 LiteLLM 或 New API），或者 Ollama 的地址。
notes: 打开 http://<主机地址>:{{ .port }}，第一个注册的人就是管理员。
