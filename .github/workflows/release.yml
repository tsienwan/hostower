# 发布：打一个 v1.2.3 这样的标签就会触发。
#
# 产物：
#   - 发布页上的可执行文件 hostower_linux_<架构> 和它们的签名（.sig）——自动更新下载的就是这些；
#     可执行文件末尾带构建封签（relsign seal），程序启动时用发布公钥校验自己，界面上显示“官方构建”；
#   - 两个镜像：ghcr.io/<仓库>:<版本>（默认）和 :<版本>-host（宿主机版）。镜像里放的就是上面加了封签的那两个文件，不另外编译。
#
# 需要在仓库设置里准备两样东西（用 go run ./tools/relsign gen 生成）：
#   - 变量 HOSTOWER_UPDATE_KEY：发布公钥，会编译进可执行文件；
#   - 机密 HOSTOWER_RELEASE_KEY：发布私钥，只在这里用来签名。
# 没有它们时照常发布，只是这一版不会自我更新。
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: write
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: 构建前端
        working-directory: web
        run: npm ci && npm run build
      - name: 测试
        run: go test ./...
      - name: 编译增强采集程序（会被编译进 Hostower）
        run: go run ./tools/buildagent "$GITHUB_REF_NAME"
      - name: 构建可执行文件
        env:
          UPDATE_KEY: ${{ vars.HOSTOWER_UPDATE_KEY }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.updateRepo=${GITHUB_REPOSITORY} -X main.updateKey=${UPDATE_KEY}" \
              -o dist/hostower_linux_$arch ./cmd/hostower
          done
      - name: 签名
        env:
          HOSTOWER_RELEASE_KEY: ${{ secrets.HOSTOWER_RELEASE_KEY }}
        run: |
          if [ -z "$HOSTOWER_RELEASE_KEY" ]; then
            echo "::warning::没有配置发布私钥：这一版没有签名，已安装的实例不会自动更新到它"
          else
            # 先封签（改的是文件本身），再签名（.sig 覆盖封好之后的文件），最后算摘要。
            go run ./tools/relsign seal dist/hostower_linux_amd64 dist/hostower_linux_arm64
            go run ./tools/relsign sign dist/hostower_linux_amd64 dist/hostower_linux_arm64
          fi
          (cd dist && sha256sum hostower_linux_amd64 hostower_linux_arm64 > SHA256SUMS)
      - name: 创建发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: 版本标签
        id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "full=$v" >> "$GITHUB_OUTPUT"
          echo "major=${v%%.*}" >> "$GITHUB_OUTPUT"
          echo "image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: 默认镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            UPDATE_REPO=${{ github.repository }}
            UPDATE_KEY=${{ vars.HOSTOWER_UPDATE_KEY }}
            PREBUILT=1
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.full }}
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.major }}
            ${{ steps.v.outputs.image }}:latest
      - name: 宿主机版镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          target: host
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            UPDATE_REPO=${{ github.repository }}
            UPDATE_KEY=${{ vars.HOSTOWER_UPDATE_KEY }}
            PREBUILT=1
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.full }}-host
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.major }}-host
            ${{ steps.v.outputs.image }}:latest-host
