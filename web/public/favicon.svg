<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 和页面左上角的标志是同一幅图：灯塔、光束和海浪，没有底框。颜色跟着浏览器的深浅模式走。 -->
  <style>
    .tower { fill: #1d1d1f } .beam, .lamp { fill: #b8860b } .wave1 { stroke: #0066cc } .wave2 { stroke: #0071e3 }
    @media (prefers-color-scheme: dark) {
      .tower { fill: #f5f5f7 } .beam, .lamp { fill: #ffd60a } .wave1 { stroke: #2997ff } .wave2 { stroke: #0a84ff }
    }
  </style>
  <path class="beam" d="M39 21 62 11v20z" opacity=".45"/>
  <path class="wave1" d="M9 47.5c5-4 9-4 14 0s9 4 14 0 9-4 14 0" fill="none" stroke-width="4" stroke-linecap="round" opacity=".55"/>
  <g class="tower">
    <path d="M24 17 32 9l8 8z"/>
    <rect x="22.5" y="25" width="19" height="3.6" rx="1.8"/>
    <path d="M26 28.6h12L41.4 50H22.6z"/>
  </g>
  <rect class="lamp" x="25.5" y="17" width="13" height="8"/>
  <path class="wave2" d="M5 54.5c6-5 11-5 17 0s11 5 17 0 11-5 18 0" fill="none" stroke-width="5" stroke-linecap="round"/>
</svg>
