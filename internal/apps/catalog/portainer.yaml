apiVersion: hostower/v1
kind: App
name: portainer
version: lts-1
title: Portainer CE
category: 运维
icon: box
summary: 网页版的 Docker 管理界面。
description: 需要挂载 Docker 套接字，等同把这台主机的 root 权限交给它，所以安装是高危操作。只在你确实需要它的界面时安装。
type: compose
params:
  - name: bind
    title: 监听地址
    type: enum
    options: ["127.0.0.1", "0.0.0.0"]
    default: 127.0.0.1
    hint: 建议只在本机监听，用 SSH 隧道访问。
  - name: port
    title: HTTPS 端口
    type: port
    default: "9443"
compose: |
  services:
    portainer:
      image: portainer/portainer-ce:lts
      restart: unless-stopped
      ports: ["{{ .bind }}:{{ .port }}:9443"]
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - ./data:/data
guide:
  open:
    - title: 管理界面
      scheme: https
      port: "{{ .port }}"
      bind: "{{ .bind }}"
  account: 没有初始账号：第一次打开时创建管理员账号，要在启动后 5 分钟内完成，超时就重启这个应用再来。
  steps:
    - 它用的是自签名证书，浏览器会提示不安全，确认后继续访问。
    - 创建账号后选“Get Started”，就能管理这台主机上的容器。
notes: 打开 https://<主机地址>:{{ .port }}，5 分钟内创建管理员账号，否则要重启容器。
